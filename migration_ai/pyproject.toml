[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-ai"
version = "0.3.15"
description = "AI layer for the migration from AAP 2.4 to a newer AAP (2.5, 2.6, 2.7) on Red Hat OpenShift AI: AAP Odyssey multi-agent assistant (planning, migration, reporting, training, CasC, smoke tests), risk model"
requires-python = ">=3.12"
dependencies = [
    "aap-bridge",              # the migration toolkit (installed from source in the image)
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "joblib>=1.4",
    "boto3>=1.34",
    "openai>=1.40",
    "httpx>=0.27",             # pipeline API, Red Hat documentation, AAP ping
    "PyYAML>=6.0",
]

[project.scripts]
migration-ai = "migration_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
migration_ai = ["*.json", "web/*.html", "web/static/**/*"]
