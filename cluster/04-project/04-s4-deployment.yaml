apiVersion: apps/v1
kind: Deployment
metadata:
  name: s4
  namespace: aap-migration-ai
  labels:
    app: s4
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: s4
  template:
    metadata:
      labels:
        app: s4
    spec:
      containers:
        - name: s4
          image: quay.io/rh-aiservices-bu/s4:latest
          envFrom:
            - secretRef:
                name: s4-credentials
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_S3_ENDPOINT
              value: http://localhost:7480
            - name: PORT
              value: "5000"
          ports:
            - {containerPort: 7480, name: s3-api}
            - {containerPort: 5000, name: web-ui}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/ceph/radosgw
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: s4-data
