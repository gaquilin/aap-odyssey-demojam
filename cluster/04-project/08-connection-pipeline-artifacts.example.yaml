apiVersion: v1
kind: Secret
metadata:
  name: pipeline-artifacts
  namespace: aap-migration-ai
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/managed: "true"
  annotations:
    opendatahub.io/connection-type-protocol: s3
    opendatahub.io/connection-type: s3
    openshift.io/display-name: Pipeline artifacts
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: REPLACE_ACCESS_KEY
  AWS_SECRET_ACCESS_KEY: REPLACE_SECRET_KEY
  AWS_S3_ENDPOINT: http://s4.aap-migration-ai.svc.cluster.local:7480
  AWS_S3_BUCKET: pipeline-artifacts
  AWS_DEFAULT_REGION: us-east-1
