apiVersion: v1
kind: Service
metadata:
  name: s4
  namespace: aap-migration-ai
  labels:
    app: s4
spec:
  selector:
    app: s4
  ports:
    - {name: s3-api, port: 7480, targetPort: 7480}
    - {name: web-ui, port: 5000, targetPort: 5000}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: s4-ui
  namespace: aap-migration-ai
spec:
  to:
    kind: Service
    name: s4
  port:
    targetPort: web-ui
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
