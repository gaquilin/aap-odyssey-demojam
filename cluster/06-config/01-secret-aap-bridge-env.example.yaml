apiVersion: v1
kind: Secret
metadata:
  name: aap-bridge-env
  namespace: aap-migration-ai
type: Opaque
stringData:
  .env: |
    SOURCE__URL=https://aap24.example.com/api/v2
    SOURCE__TOKEN=REPLACE_AAP24_TOKEN
    SOURCE__VERIFY_SSL=false
    SOURCE__TIMEOUT=300
    TARGET__URL=https://aap26.example.com/api/controller/v2
    TARGET__TOKEN=REPLACE_AAP26_TOKEN
    TARGET__VERIFY_SSL=false
    TARGET__TIMEOUT=300
    MIGRATION_STATE_DB_PATH=sqlite:///./database/migration_state.db
