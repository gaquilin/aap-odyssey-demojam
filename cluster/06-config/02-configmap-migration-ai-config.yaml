apiVersion: v1
kind: ConfigMap
metadata:
  name: migration-ai-config
  namespace: aap-migration-ai
data:
  LLM_BASE_URL: "http://qwen3-8b-predictor.aap-migration-ai.svc.cluster.local:8080/v1"
  LLM_MODEL: "qwen3-8b"
  LLM_TEMPERATURE: "0.1"
  LLM_MAX_TOKENS: "1024"
  LLM_TIMEOUT: "300"
  LLM_VERIFY_TLS: "true"
  LLM_EXTRA_BODY: '{"chat_template_kwargs": {"enable_thinking": false}}'
  MIGRATIONS_PREFIX: "migrations"
  MODELS_PREFIX: "models/aap-migration-risk"
  AWS_S3_VERIFY_TLS: "/run/secrets/kubernetes.io/serviceaccount/service-ca.crt"
  AAP_RELEASE_NOTES_URLS: ""
  AAP_RELEASE_NOTES_CACHE_HOURS: "6"
  AAP_RELEASE_NOTES_USER_AGENT: ""
  AAP_RELEASE_NOTES_SOURCE: "web"
