apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: granite-4-h-tiny
  namespace: aap-migration-ai
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: Granite 4.0 H Tiny FP8 (migration agents)
    serving.kserve.io/deploymentMode: RawDeployment
    opendatahub.io/hardware-profile-name: nvidia-gpu
    opendatahub.io/hardware-profile-namespace: redhat-ods-applications
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    nodeSelector:
      nvidia.com/gpu.present: "true"
    model:
      runtime: vllm-cuda-runtime
      modelFormat:
        name: vLLM
      storageUri: oci://registry.redhat.io/rhai/modelcar-granite-4-0-h-tiny-fp8-dynamic:3.0
      args:
        - --max-model-len=32768
        - --gpu-memory-utilization=0.90
        - --enable-auto-tool-choice
        - --tool-call-parser=hermes
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "7"
          memory: 28Gi
          nvidia.com/gpu: "1"
