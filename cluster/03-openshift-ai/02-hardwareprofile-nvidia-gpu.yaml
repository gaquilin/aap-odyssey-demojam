apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: nvidia-gpu
  namespace: redhat-ods-applications
  annotations:
    opendatahub.io/display-name: NVIDIA GPU
    opendatahub.io/description: 1 NVIDIA GPU (L4), 2-7 CPUs, 8-28 GiB memory (LLM serving)
    opendatahub.io/disabled: "false"
spec:
  identifiers:
    - displayName: CPU
      identifier: cpu
      resourceType: CPU
      minCount: 2
      defaultCount: 4
      maxCount: 7
    - displayName: Memory
      identifier: memory
      resourceType: Memory
      minCount: 8Gi
      defaultCount: 16Gi
      maxCount: 28Gi
    - displayName: NVIDIA GPU
      identifier: nvidia.com/gpu
      resourceType: Accelerator
      minCount: 1
      defaultCount: 1
      maxCount: 1
  scheduling:
    type: Node
    node:
      nodeSelector:
        nvidia.com/gpu.present: "true"
