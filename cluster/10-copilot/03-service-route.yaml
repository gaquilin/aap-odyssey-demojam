apiVersion: v1
kind: Service
metadata:
  name: migration-copilot
  namespace: aap-migration-ai
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: migration-copilot-tls
spec:
  selector:
    app: migration-copilot
  ports:
    - name: https
      port: 8443
      targetPort: 8443
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: migration-copilot
  namespace: aap-migration-ai
  annotations:
    haproxy.router.openshift.io/timeout: 5m
spec:
  to:
    kind: Service
    name: migration-copilot
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
