components:
  comp-agent-op:
    executorLabel: exec-agent-op
    inputDefinitions:
      parameters:
        abort_failure_rate:
          parameterType: NUMBER_DOUBLE
        dry_run:
          parameterType: BOOLEAN
        include_credentials:
          parameterType: BOOLEAN
        include_iam:
          parameterType: BOOLEAN
        migration_id:
          parameterType: STRING
        mode:
          parameterType: STRING
        use_llm:
          parameterType: BOOLEAN
    outputDefinitions:
      artifacts:
        report:
          artifactType:
            schemaTitle: system.Markdown
            schemaVersion: 0.0.1
      parameters:
        collectable:
          parameterType: STRING
        status:
          parameterType: STRING
  comp-casc-op:
    executorLabel: exec-casc-op
    inputDefinitions:
      parameters:
        include_hosts:
          parameterType: BOOLEAN
        migration_id:
          parameterType: STRING
        organization:
          parameterType: STRING
        resource_types:
          parameterType: STRING
        review:
          parameterType: BOOLEAN
        source:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        casc_readme:
          artifactType:
            schemaTitle: system.Markdown
            schemaVersion: 0.0.1
  comp-condition-1:
    dag:
      tasks:
        casc-op:
          cachingOptions: {}
          componentRef:
            name: comp-casc-op
          dependentTasks:
          - dataset-op
          inputs:
            parameters:
              include_hosts:
                runtimeValue:
                  constant: false
              migration_id:
                componentInputParameter: pipelinechannel--migration_id
              organization:
                runtimeValue:
                  constant: ''
              resource_types:
                runtimeValue:
                  constant: ''
              review:
                componentInputParameter: pipelinechannel--casc_review
              source:
                runtimeValue:
                  constant: migration
          taskInfo:
            name: 5. Configuration as Code
        condition-2:
          componentRef:
            name: comp-condition-2
          dependentTasks:
          - dataset-op
          inputs:
            parameters:
              pipelinechannel--agent-op-collectable:
                componentInputParameter: pipelinechannel--agent-op-collectable
              pipelinechannel--train_after:
                componentInputParameter: pipelinechannel--train_after
          taskInfo:
            name: train-after-migration
          triggerPolicy:
            condition: inputs.parameter_values['pipelinechannel--train_after'] ==
              true
        dataset-op:
          cachingOptions: {}
          componentRef:
            name: comp-dataset-op
          dependentTasks:
          - post-reports-op
          inputs:
            parameters:
              migration_id:
                componentInputParameter: pipelinechannel--migration_id
          taskInfo:
            name: 4. Training dataset
        post-reports-op:
          cachingOptions: {}
          componentRef:
            name: comp-post-reports-op
          inputs:
            parameters:
              migration_id:
                componentInputParameter: pipelinechannel--migration_id
          taskInfo:
            name: 3. Enhanced report
    inputDefinitions:
      parameters:
        pipelinechannel--agent-op-collectable:
          parameterType: STRING
        pipelinechannel--casc_review:
          parameterType: BOOLEAN
        pipelinechannel--migration_id:
          parameterType: STRING
        pipelinechannel--train_after:
          parameterType: BOOLEAN
  comp-condition-2:
    dag:
      tasks:
        train-op:
          cachingOptions: {}
          componentRef:
            name: comp-train-op
          inputs:
            parameters:
              migrations:
                runtimeValue:
                  constant: all
              threshold:
                runtimeValue:
                  constant: 0.5
          taskInfo:
            name: 6. Train risk model
    inputDefinitions:
      parameters:
        pipelinechannel--agent-op-collectable:
          parameterType: STRING
        pipelinechannel--train_after:
          parameterType: BOOLEAN
  comp-dataset-op:
    executorLabel: exec-dataset-op
    inputDefinitions:
      parameters:
        migration_id:
          parameterType: STRING
  comp-post-reports-op:
    executorLabel: exec-post-reports-op
    inputDefinitions:
      parameters:
        migration_id:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        enhanced_report:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
  comp-prepare-op:
    executorLabel: exec-prepare-op
    inputDefinitions:
      parameters:
        migration_id:
          parameterType: STRING
        refresh_export:
          parameterType: BOOLEAN
        with_dependencies:
          parameterType: BOOLEAN
    outputDefinitions:
      artifacts:
        readiness:
          artifactType:
            schemaTitle: system.HTML
            schemaVersion: 0.0.1
  comp-train-op:
    executorLabel: exec-train-op
    inputDefinitions:
      parameters:
        migrations:
          parameterType: STRING
        threshold:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        model_card:
          artifactType:
            schemaTitle: system.Markdown
            schemaVersion: 0.0.1
      parameters:
        status:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-agent-op:
      container:
        args:
        - agent
        - --migration-id
        - '{{$.inputs.parameters[''migration_id'']}}'
        - --mode
        - '{{$.inputs.parameters[''mode'']}}'
        - --dry-run
        - '{{$.inputs.parameters[''dry_run'']}}'
        - --include-credentials
        - '{{$.inputs.parameters[''include_credentials'']}}'
        - --include-iam
        - '{{$.inputs.parameters[''include_iam'']}}'
        - --use-llm
        - '{{$.inputs.parameters[''use_llm'']}}'
        - --abort-failure-rate
        - '{{$.inputs.parameters[''abort_failure_rate'']}}'
        - --out-md
        - '{{$.outputs.artifacts[''report''].path}}'
        - --out-status
        - '{{$.outputs.parameters[''status''].output_file}}'
        - --out-collectable
        - '{{$.outputs.parameters[''collectable''].output_file}}'
        command:
        - migration-ai
        image: image-registry.openshift-image-registry.svc:5000/aap-migration-ai/aap-migration-ai:latest
        resources:
          cpuRequest: 0.5
          memoryLimit: 6.442450944
          memoryRequest: 1.073741824
          resourceCpuRequest: 500m
          resourceMemoryLimit: 6Gi
          resourceMemoryRequest: 1Gi
    exec-casc-op:
      container:
        args:
        - casc
        - --migration-id
        - '{{$.inputs.parameters[''migration_id'']}}'
        - --source
        - '{{$.inputs.parameters[''source'']}}'
        - --organization
        - '{{$.inputs.parameters[''organization'']}}'
        - --resource-types
        - '{{$.inputs.parameters[''resource_types'']}}'
        - --include-hosts
        - '{{$.inputs.parameters[''include_hosts'']}}'
        - --review
        - '{{$.inputs.parameters[''review'']}}'
        - --out-md
        - '{{$.outputs.artifacts[''casc_readme''].path}}'
        command:
        - migration-ai
        image: image-registry.openshift-image-registry.svc:5000/aap-migration-ai/aap-migration-ai:latest
        resources:
          cpuRequest: 0.5
          memoryLimit: 4.294967296
          memoryRequest: 1.073741824
          resourceCpuRequest: 500m
          resourceMemoryLimit: 4Gi
          resourceMemoryRequest: 1Gi
    exec-dataset-op:
      container:
        args:
        - dataset
        - --migration-id
        - '{{$.inputs.parameters[''migration_id'']}}'
        command:
        - migration-ai
        image: image-registry.openshift-image-registry.svc:5000/aap-migration-ai/aap-migration-ai:latest
        resources:
          cpuRequest: 0.5
          memoryLimit: 4.294967296
          memoryRequest: 1.073741824
          resourceCpuRequest: 500m
          resourceMemoryLimit: 4Gi
          resourceMemoryRequest: 1Gi
    exec-post-reports-op:
      container:
        args:
        - post-reports
        - --migration-id
        - '{{$.inputs.parameters[''migration_id'']}}'
        - --out-html
        - '{{$.outputs.artifacts[''enhanced_report''].path}}'
        command:
        - migration-ai
        image: image-registry.openshift-image-registry.svc:5000/aap-migration-ai/aap-migration-ai:latest
        resources:
          cpuRequest: 0.5
          memoryLimit: 4.294967296
          memoryRequest: 1.073741824
          resourceCpuRequest: 500m
          resourceMemoryLimit: 4Gi
          resourceMemoryRequest: 1Gi
    exec-prepare-op:
      container:
        args:
        - prepare
        - --migration-id
        - '{{$.inputs.parameters[''migration_id'']}}'
        - --refresh-export
        - '{{$.inputs.parameters[''refresh_export'']}}'
        - --with-dependencies
        - '{{$.inputs.parameters[''with_dependencies'']}}'
        - --out-html
        - '{{$.outputs.artifacts[''readiness''].path}}'
        command:
        - migration-ai
        image: image-registry.openshift-image-registry.svc:5000/aap-migration-ai/aap-migration-ai:latest
        resources:
          cpuRequest: 0.5
          memoryLimit: 4.294967296
          memoryRequest: 1.073741824
          resourceCpuRequest: 500m
          resourceMemoryLimit: 4Gi
          resourceMemoryRequest: 1Gi
    exec-train-op:
      container:
        args:
        - train
        - --migrations
        - '{{$.inputs.parameters[''migrations'']}}'
        - --threshold
        - '{{$.inputs.parameters[''threshold'']}}'
        - --out-md
        - '{{$.outputs.artifacts[''model_card''].path}}'
        - --out-status
        - '{{$.outputs.parameters[''status''].output_file}}'
        command:
        - migration-ai
        image: image-registry.openshift-image-registry.svc:5000/aap-migration-ai/aap-migration-ai:latest
        resources:
          cpuRequest: 1.0
          memoryLimit: 4.294967296
          memoryRequest: 2.147483648
          resourceCpuRequest: '1'
          resourceMemoryLimit: 4Gi
          resourceMemoryRequest: 2Gi
pipelineInfo:
  description: 'DURING migration: prepare, migration agent (plan/execute/collect),
    then collect the migration data, generate CasC and (re)train the risk model.'
  name: aap-migration-during
root:
  dag:
    tasks:
      agent-op:
        cachingOptions: {}
        componentRef:
          name: comp-agent-op
        dependentTasks:
        - prepare-op
        inputs:
          parameters:
            abort_failure_rate:
              componentInputParameter: abort_failure_rate
            dry_run:
              componentInputParameter: dry_run
            include_credentials:
              componentInputParameter: include_credentials
            include_iam:
              componentInputParameter: include_iam
            migration_id:
              componentInputParameter: migration_id
            mode:
              componentInputParameter: mode
            use_llm:
              componentInputParameter: use_llm
        taskInfo:
          name: 2. Migration agent
      condition-1:
        componentRef:
          name: comp-condition-1
        dependentTasks:
        - agent-op
        inputs:
          parameters:
            pipelinechannel--agent-op-collectable:
              taskOutputParameter:
                outputParameterKey: collectable
                producerTask: agent-op
            pipelinechannel--casc_review:
              componentInputParameter: casc_review
            pipelinechannel--migration_id:
              componentInputParameter: migration_id
            pipelinechannel--train_after:
              componentInputParameter: train_after
        taskInfo:
          name: migration-has-results
        triggerPolicy:
          condition: inputs.parameter_values['pipelinechannel--agent-op-collectable']
            == 'true'
      prepare-op:
        cachingOptions: {}
        componentRef:
          name: comp-prepare-op
        inputs:
          parameters:
            migration_id:
              componentInputParameter: migration_id
            refresh_export:
              componentInputParameter: refresh_export
            with_dependencies:
              componentInputParameter: with_dependencies
        taskInfo:
          name: 1. Export + pre-migration report
  inputDefinitions:
    parameters:
      abort_failure_rate:
        defaultValue: 0.5
        isOptional: true
        parameterType: NUMBER_DOUBLE
      casc_review:
        defaultValue: true
        isOptional: true
        parameterType: BOOLEAN
      dry_run:
        defaultValue: false
        isOptional: true
        parameterType: BOOLEAN
      include_credentials:
        defaultValue: false
        isOptional: true
        parameterType: BOOLEAN
      include_iam:
        defaultValue: false
        isOptional: true
        parameterType: BOOLEAN
      migration_id:
        defaultValue: aap24-to-aap26
        isOptional: true
        parameterType: STRING
      mode:
        defaultValue: plan
        isOptional: true
        parameterType: STRING
      refresh_export:
        defaultValue: false
        isOptional: true
        parameterType: BOOLEAN
      train_after:
        defaultValue: true
        isOptional: true
        parameterType: BOOLEAN
      use_llm:
        defaultValue: true
        isOptional: true
        parameterType: BOOLEAN
      with_dependencies:
        defaultValue: true
        isOptional: true
        parameterType: BOOLEAN
