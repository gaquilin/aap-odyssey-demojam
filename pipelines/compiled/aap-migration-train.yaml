components:
  comp-train-op:
    executorLabel: exec-train-op
    inputDefinitions:
      parameters:
        migrations:
          parameterType: STRING
        threshold:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        model_card:
          artifactType:
            schemaTitle: system.Markdown
            schemaVersion: 0.0.1
      parameters:
        status:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-train-op:
      container:
        args:
        - train
        - --migrations
        - '{{$.inputs.parameters[''migrations'']}}'
        - --threshold
        - '{{$.inputs.parameters[''threshold'']}}'
        - --out-md
        - '{{$.outputs.artifacts[''model_card''].path}}'
        - --out-status
        - '{{$.outputs.parameters[''status''].output_file}}'
        command:
        - migration-ai
        image: image-registry.openshift-image-registry.svc:5000/aap-migration-ai/aap-migration-ai:latest
        resources:
          cpuRequest: 1.0
          memoryLimit: 4.294967296
          memoryRequest: 2.147483648
          resourceCpuRequest: '1'
          resourceMemoryLimit: 4Gi
          resourceMemoryRequest: 2Gi
pipelineInfo:
  description: 'AFTER migration: train and evaluate the risk model on the datasets
    of all migrations.'
  name: aap-migration-train
root:
  dag:
    tasks:
      train-op:
        cachingOptions: {}
        componentRef:
          name: comp-train-op
        inputs:
          parameters:
            migrations:
              componentInputParameter: migrations
            threshold:
              componentInputParameter: threshold
        taskInfo:
          name: Train risk model
  inputDefinitions:
    parameters:
      migrations:
        defaultValue: all
        isOptional: true
        parameterType: STRING
      threshold:
        defaultValue: 0.5
        isOptional: true
        parameterType: NUMBER_DOUBLE
schemaVersion: 2.1.0
sdkVersion: kfp-2.14.3
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-train-op:
          configMapAsEnv:
          - configMapName: migration-ai-config
            configMapNameParameter:
              runtimeValue:
                constant: migration-ai-config
            keyToEnv:
            - configMapKey: LLM_BASE_URL
              envVar: LLM_BASE_URL
            - configMapKey: LLM_MODEL
              envVar: LLM_MODEL
            - configMapKey: LLM_TEMPERATURE
              envVar: LLM_TEMPERATURE
            - configMapKey: LLM_MAX_TOKENS
              envVar: LLM_MAX_TOKENS
            - configMapKey: LLM_EXTRA_BODY
              envVar: LLM_EXTRA_BODY
            - configMapKey: LLM_VERIFY_TLS
              envVar: LLM_VERIFY_TLS
            - configMapKey: LLM_TIMEOUT
              envVar: LLM_TIMEOUT
            - configMapKey: MIGRATIONS_PREFIX
              envVar: MIGRATIONS_PREFIX
            - configMapKey: MODELS_PREFIX
              envVar: MODELS_PREFIX
            - configMapKey: AWS_S3_VERIFY_TLS
              envVar: AWS_S3_VERIFY_TLS
          emptyDirMounts:
          - mountPath: /work
            volumeName: work
          imagePullPolicy: Always
          secretAsEnv:
          - keyToEnv:
            - envVar: AWS_ACCESS_KEY_ID
              secretKey: AWS_ACCESS_KEY_ID
            - envVar: AWS_SECRET_ACCESS_KEY
              secretKey: AWS_SECRET_ACCESS_KEY
            - envVar: AWS_S3_ENDPOINT
              secretKey: AWS_S3_ENDPOINT
            - envVar: AWS_S3_BUCKET
              secretKey: AWS_S3_BUCKET
            - envVar: AWS_DEFAULT_REGION
              secretKey: AWS_DEFAULT_REGION
            secretName: aap-migration-data
            secretNameParameter:
              runtimeValue:
                constant: aap-migration-data
          - keyToEnv:
            - envVar: LLM_API_KEY
              secretKey: LLM_API_KEY
            secretName: migration-ai-llm
            secretNameParameter:
              runtimeValue:
                constant: migration-ai-llm
